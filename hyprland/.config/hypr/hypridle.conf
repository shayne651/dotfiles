general {
    lock_cmd = pidof hyprlock || hyprlock  # don't spawn multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300  # 5 min: lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600  # 10 min: turn off displays (only if not locked)
    on-timeout = pgrep -x hyprlock || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800  # 30 min: suspend
    on-timeout = systemctl suspend
}
