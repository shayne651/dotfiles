- name: Install and Configure ubuntu desktop
  block:

# Determining if the system is ubuntu desktop
  - name: Check if GUI is installed
    shell: "dpkg -l | grep -E 'ubuntu-desktop|gnome-shell|plasma-desktop'"
    register: gui_check
    changed_when: false
    failed_when: false

  - name: Set fact for Ubuntu type
    set_fact:
      ubuntu_type: "{{ 'desktop' if gui_check.stdout else 'server' }}"

# INSTALLING hyprland
  - name: Add specified repository into sources list
    when: ubuntu_type == "desktop"
    apt_repository:
      repo: universe
      state: present

  - name: Install hyprland
    when: ubuntu_type == "desktop"
    become: yes
    apt:
      name: hyprland
      state: present
      update_cache: yes

# INSTALLING awww
  - name: Install awww
    when: ubuntu_type == "desktop"
    become: yes
    apt:
      name: awww
      state: present
      update_cache: yes

# INSTALLING hypridle
  - name: Install hypridle
    when: ubuntu_type == "desktop"
    become: yes
    apt:
      name: hypridle
      state: present
      update_cache: yes

# INSTALLING sddm (display manager with login screen)
  - name: Install sddm on ubuntu desktop
    when: ubuntu_type == "desktop"
    become: yes
    apt:
      name: sddm
      state: present
      update_cache: yes

  - name: Enable and start SDDM on ubuntu desktop
    when: ubuntu_type == "desktop"
    become: yes
    ansible.builtin.systemd:
      name: sddm
      enabled: yes
      state: started

# INSTALLING ghostty from apt (no Snap usage)
  - name: Installing ghostty
    when: ubuntu_type == "desktop"
    become: yes
    apt:
      name: ghostty
      state: present

# Postman has no Ubuntu apt package; it is intentionally not installed.
