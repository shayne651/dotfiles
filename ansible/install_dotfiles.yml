- name: Install dotfiles
  vars:
    home_dir: "{% if ansible_facts['os_family'] == 'Darwin' %}/Users/{{ ansible_user }}{% else %}/home/{{ ansible_user }}{% endif %}"
    dotfiles_dir: "{{ home_dir }}/dotfiles"

  block:
    - name: Remove conflicting files
      file:
        path: "{{ home_dir }}/.config/{{ item }}"
        state: absent
      loop:
        - starship.toml
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - nvim
        - tmux
        - hyprland
        - rofi
        - waybar
        - ghostty

    - name: Remove conflicting files
      file:
        path: "{{ home_dir }}/{{ item }}"
        state: absent
      loop:
        - .tmux.conf
        - starship.toml
        - tmux.conf
        - .zshrc
        - .zprofile
        - .tmux

    - name: ensure .zshrc-specific exists
      copy:
        content: ""
        dest: "{{ home_dir }}/.zshrc-specific"
        force: false

    # CONFIGURE ZSH
    - name: Install Starship (Debian only — other platforms use package manager)
      when: ansible_facts['os_family'] == "Debian"
      shell: curl -sS https://starship.rs/install.sh | sh -s -- -y

    - name: Configure dotfiles with stow
      shell: stow --target="{{ home_dir }}" zshrc
      args:
        chdir: "{{ dotfiles_dir }}"

    - name: Ensure Zsh is the default shell
      lineinfile:
        path: "{{ home_dir }}/.bashrc"
        line: "exec zsh"
        create: yes

# CONFIGURE nvim
    - name: Configure nvim
      shell: |
        stow --target={{ home_dir }} nvim
      args:
        chdir: "{{ dotfiles_dir }}"

# CONFIGURE hyprland
    - name: Configure hyprland
      shell: |
        stow --target={{ home_dir }} hyprland
      args:
        chdir: "{{ dotfiles_dir }}"

# DOWNLOAD NASA wallpapers
    - name: Create wallpaper venv
      when: ansible_facts['os_family'] == "Archlinux"
      command: python3 -m venv {{ home_dir }}/.config/background_photos/photo.env
      args:
        creates: "{{ home_dir }}/.config/background_photos/photo.env"

    - name: Install wallpaper venv dependencies
      when: ansible_facts['os_family'] == "Archlinux"
      pip:
        requirements: "{{ home_dir }}/.config/background_photos/requirements.txt"
        virtualenv: "{{ home_dir }}/.config/background_photos/photo.env"

    - name: Download NASA wallpapers
      when: ansible_facts['os_family'] == "Archlinux"
      command: "{{ home_dir }}/.config/background_photos/photo.env/bin/python {{ home_dir }}/.config/background_photos/getPhotos.py --limit 50"
      args:
        chdir: "{{ home_dir }}/.config/background_photos"

# CONFIGURE ghostty
    - name: Configure ghostty
      shell: |
        stow --target={{ home_dir }} ghostty
      args:
        chdir: "{{ dotfiles_dir }}"

    - name: Write ghostty local config (platform-specific opacity)
      copy:
        content: "background-opacity = {{ '0.8' if ansible_facts['os_family'] == 'Darwin' else '0.5' }}\n"
        dest: "{{ home_dir }}/.config/ghostty/config.local"

#CONFIGURE tmux
    - name: Configure tmux
      shell: |
        stow --target={{ home_dir }} tmux
      args:
        chdir: "{{ dotfiles_dir }}"

    - name: Ensure tmux session is running
      shell: tmux has-session -t mysession 2>/dev/null || tmux new-session -d -s mysession
      changed_when: false

    - name: Source .tmux.conf to reload tmux configuration
      shell: "tmux source-file {{ home_dir }}/.tmux.conf"
      when: ansible_facts['tmux']['session']['mysession'] is defined

    - name: Install tmux plugins using TPM
      shell: "{{ home_dir }}/.tmux/plugins/tpm/bin/install_plugins"
      when: ansible_facts['tmux']['session']['mysession'] is defined
