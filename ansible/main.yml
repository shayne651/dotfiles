---
- name: Setup system
  hosts: localhost
  gather_facts: yes
  # Makefile authenticates sudo before Ansible starts. Do not let the
  # become plugin open a second prompt through the localhost connection.
  vars:
    ansible_become_flags: "-n"

  tasks:
#    - name: Validate become password
#      command: true
#      become: yes
#      changed_when: false

    - import_tasks: install_mac_dependencies.yml
    - import_tasks: install_common.yml
    - import_tasks: configure_ubuntu_desktop.yml
    - import_tasks: install_dotfiles.yml
