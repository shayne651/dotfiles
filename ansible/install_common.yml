- name: Installing commonly used
  vars:
    arch_packages:
      - docker
      - docker-compose
      - go
      - ghostty
      - gitui
      - imagemagick
      - luarocks
      - uwsm
      - chafa
      # NVIDIA drivers (open-source kernel module + utilities)
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings
      - linux-firmware-nvidia
      # Kernel headers required by DKMS to build nvidia-open-dkms
      - linux-headers
      - linux-lts-headers
    mac_homebrew_packages:
      - docker
      - go
      - gitui
      - imagemagick
      - luarocks
    mac_cask_packages:
      - postman
      - ghostty

  block:

  # ARCH LINUX - bulk install
  - name: Install packages on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: "{{ arch_packages }}"
      state: present

  # ARCH LINUX - autologin setup (hyprlock runs on first Hyprland start)
  - name: Disable SDDM on Arch if present
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.systemd:
      name: sddm
      enabled: no
      state: stopped
    ignore_errors: yes

  - name: Create getty autologin override directory on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.file:
      path: /etc/systemd/system/getty@tty1.service.d
      state: directory
      mode: '0755'

  - name: Configure getty autologin on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.copy:
      dest: /etc/systemd/system/getty@tty1.service.d/override.conf
      content: |
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin shayne --noclear %I $TERM

  # MACOS - bulk install
  - name: Install homebrew packages on macOS
    when: ansible_facts['os_family'] == "Darwin"
    homebrew:
      name: "{{ mac_homebrew_packages }}"
      state: present

  - name: Install homebrew cask packages on macOS
    when: ansible_facts['os_family'] == "Darwin"
    homebrew_cask:
      name: "{{ mac_cask_packages }}"
      state: present

  # DEBIAN - per-package (each has a unique install method)

  - name: Install docker on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    block:
      - name: Update apt package index
        apt:
          update_cache: yes

      - name: Install dependencies
        apt:
          name:
            - ca-certificates
            - curl
          state: present

      - name: Create apt keyrings directory
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Add Docker GPG key
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'

      - name: Add Docker repository
        shell: |
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
        args:
          executable: /bin/bash

      - name: Update apt package index after adding repository
        apt:
          update_cache: yes

      - name: Install Docker packages
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present

  - name: Install go on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    snap:
      name: go
      classic: yes

  - name: Install gitui on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    shell: |
      curl -s https://api.github.com/repos/extrawurst/gitui/releases/latest | grep -wo "https.*linux.*gz" | wget -qi -
      tar xzvf gitui-linux-musl.tar.gz
      rm gitui-linux-musl.tar.gz
      chmod +x gitui
      mv gitui /usr/local/bin

  # POSTMAN on Arch (AUR)
  - name: Install Postman on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq postman-bin 2>/dev/null || yay -S --noconfirm postman-bin
    changed_when: false

  # IMAGEMAGICK + LUAROCKS (neovim image preview)
  - name: Install imagemagick and luarocks on Debian
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    apt:
      name:
        - imagemagick
        - luarocks
      state: present
      update_cache: yes


  # AWWW (AUR - Arch only; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install awww via yay on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    environment:
      HOME: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq awww 2>/dev/null || yay -S --noconfirm --sudoflags "-n" awww
    changed_when: false

  # HYPRIDLE (Arch official repos; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install hypridle on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: hypridle
      state: present

  # CLAUDE CODE (all platforms)
  - name: Install Claude Code
    shell: curl -fsSL https://claude.ai/install.sh | bash
    args:
      creates: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}/.claude/local/claude"
