- name: Installing commonly used
  vars:
    arch_packages:
      - docker
      - docker-compose
      - fastfetch
      - go
      - ghostty
      - gitui
      - imagemagick
      - luarocks
      - starship
      - uwsm
      - chafa
      - blueman
      - pavucontrol
      # NVIDIA drivers (open-source kernel module + utilities)
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings
      - linux-firmware-nvidia
      # Kernel headers required by DKMS to build nvidia-open-dkms
      - linux-headers
      - linux-lts-headers
    mac_homebrew_packages:
      - docker
      - fastfetch
      - go
      - gitui
      - imagemagick
      - luarocks
      - starship
    mac_cask_packages:
      - postman
      - ghostty

  block:

  # ARCH LINUX - bulk install
  - name: Install packages on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: "{{ arch_packages }}"
      state: present

  # ARCH LINUX - autologin setup (hyprlock runs on first Hyprland start)
  - name: Disable SDDM on Arch if present
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.systemd:
      name: sddm
      enabled: no
      state: stopped
    ignore_errors: yes

  - name: Create getty autologin override directory on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.file:
      path: /etc/systemd/system/getty@tty1.service.d
      state: directory
      mode: '0755'

  - name: Configure getty autologin on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.copy:
      dest: /etc/systemd/system/getty@tty1.service.d/override.conf
      content: |
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin shayne --noclear %I $TERM

  # MACOS - bulk install
  - name: Install homebrew packages on macOS
    when: ansible_facts['os_family'] == "Darwin"
    homebrew:
      name: "{{ mac_homebrew_packages }}"
      state: present

  - name: Install homebrew cask packages on macOS
    when: ansible_facts['os_family'] == "Darwin"
    homebrew_cask:
      name: "{{ mac_cask_packages }}"
      state: present

  # DEBIAN - per-package (each has a unique install method)

  - name: Install docker on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    block:
      - name: Update apt package index
        apt:
          update_cache: yes

      - name: Install dependencies
        apt:
          name:
            - ca-certificates
            - curl
          state: present

      - name: Create apt keyrings directory
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Add Docker GPG key
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'

      - name: Get dpkg architecture
        command: dpkg --print-architecture
        register: dpkg_arch
        changed_when: false

      - name: Add Docker repository
        ansible.builtin.apt_repository:
          repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
          state: present
          filename: docker

      - name: Install Docker packages
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present

  - name: Install go on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    snap:
      name: go
      classic: yes

  - name: Install gitui on ubuntu
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    shell: |
      ARCH=$(uname -m)
      if [ "$ARCH" = "aarch64" ]; then
        TARBALL="gitui-linux-aarch64.tar.gz"
      else
        TARBALL="gitui-linux-musl.tar.gz"
      fi
      URL=$(curl -Ls https://api.github.com/repos/gitui-org/gitui/releases/latest | grep -o "https://[^\"]*${TARBALL}")
      wget -q "$URL" -O "$TARBALL"
      tar xzvf "$TARBALL"
      rm "$TARBALL"
      chmod +x gitui
      mv gitui /usr/local/bin

  # POSTMAN on Arch (AUR)
  - name: Install Postman on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq postman-bin 2>/dev/null || yay -S --noconfirm postman-bin
    changed_when: false

  # FASTFETCH (system info on terminal startup)
  - name: Add fastfetch ppa
    when: ansible_facts['os_family'] == "Debian"
    become: true
    ansible.builtin.apt_repository:
      repo: ppa:zhangsongcui3371/fastfetch
  - name: Install fastfetch on Debian
    when: ansible_facts['os_family'] == "Debian"
    become: true
    apt:
      name: fastfetch
      state: present
      update_cache: yes

  # IMAGEMAGICK + LUAROCKS (neovim image preview)
  - name: Install imagemagick and luarocks on Debian
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    apt:
      name:
        - imagemagick
        - luarocks
      state: present
      update_cache: yes


  # PAVUCONTROL (audio device switcher GUI - desktop only)
  - name: Install pavucontrol on Debian desktop
    when: ansible_facts['os_family'] == "Debian" and ubuntu_type == "desktop"
    become: yes
    apt:
      name: pavucontrol
      state: present

  # BLUETOOTH (Arch only)
  - name: Enable and start bluetooth service on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.systemd:
      name: bluetooth
      enabled: yes
      state: started

  - name: Disable blueman connection/disconnection popup notifications
    when: ansible_facts['os_family'] == "Archlinux"
    become: false
    community.general.dconf:
      key: /org/blueman/general/plugin-list
      value: "['!ConnectionNotifier']"
      state: present

  # AWWW (AUR - Arch only; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install awww via yay on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    environment:
      HOME: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq awww 2>/dev/null || yay -S --noconfirm --sudoflags "-n" awww
    changed_when: false

  # HYPRIDLE (Arch official repos; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install hypridle on Arch Linux
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: hypridle
      state: present

  # CLAUDE CODE (all platforms)
  - name: Install Claude Code
    shell: curl -fsSL https://claude.ai/install.sh | bash
    args:
      creates: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}/.claude/local/claude"
