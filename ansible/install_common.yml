- name: Install packages
  vars:
    arch_packages:
      - stow
      - nvim
      - tmux
      - zsh
      - rbenv
      - unzip
      - docker
      - docker-compose
      - fastfetch
      - go
      - ghostty
      - gitui
      - imagemagick
      - luarocks
      - starship
      - uwsm
      - chafa
      - blueman
      - pavucontrol
      # NVIDIA drivers (open-source kernel module + utilities)
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings
      - linux-firmware-nvidia
      # Kernel headers required by DKMS to build nvidia-open-dkms
      - linux-headers
      - linux-lts-headers
    mac_homebrew_packages:
      - nvim
      - stow
      - tmux
      - rbenv
      - unzip
      - docker
      - fastfetch
      - go
      - gitui
      - imagemagick
      - luarocks
      - starship
    mac_cask_packages:
      - postman
      - ghostty
    debian_packages:
      - stow
      - tmux
      - zsh
      - rbenv
      - unzip
      - imagemagick
      - luarocks
      - chafa
      - fastfetch
      - ca-certificates
      - curl
      - wget
    fedora_packages:
      - stow
      - neovim
      - tmux
      - zsh
      - unzip
      - ImageMagick
      - luarocks
      - dnf-plugins-core
      - chafa
      - fastfetch
      - golang
      - gitui
      - curl
      - wget

  block:

  # DEBIAN - add fastfetch PPA before bulk install
  - name: Add fastfetch PPA (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    ansible.builtin.apt_repository:
      repo: ppa:zhangsongcui3371/fastfetch

  # ARCH LINUX - bulk install
  - name: Install packages (Arch Linux)
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: "{{ arch_packages }}"
      state: present

  # DEBIAN - bulk install
  - name: Install packages (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    apt:
      name: "{{ debian_packages }}"
      state: present
      update_cache: yes

  # FEDORA - bulk install
  - name: Install packages (Fedora)
    when: ansible_facts['distribution'] == "Fedora"
    become: yes
    dnf:
      name: "{{ fedora_packages }}"
      state: present

  # FEDORA - starship (not in default repos; use COPR)
  - name: Enable starship COPR (Fedora)
    when: ansible_facts['distribution'] == "Fedora"
    become: yes
    community.general.copr:
      name: atim/starship
      state: enabled

  - name: Install starship (Fedora)
    when: ansible_facts['distribution'] == "Fedora"
    become: yes
    dnf:
      name: starship
      state: present

  # MACOS - bulk install
  - name: Install homebrew packages (macOS)
    when: ansible_facts['os_family'] == "Darwin"
    homebrew:
      name: "{{ mac_homebrew_packages }}"
      state: present

  - name: Install homebrew cask packages (macOS)
    when: ansible_facts['os_family'] == "Darwin"
    homebrew_cask:
      name: "{{ mac_cask_packages }}"
      state: present

  # ZSH - set as default shell on all non-Mac systems
  - name: Set zsh as default shell
    when: ansible_facts['os_family'] != "Darwin"
    become: yes
    user:
      name: "{{ ansible_env.USER }}"
      shell: /usr/bin/zsh

  # DEBIAN - snap installs (nvim, go — Ubuntu keeps snap; Fedora uses dnf)
  - name: Install nvim via snap (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    snap:
      name: nvim
      classic: yes

  - name: Install go via snap (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    snap:
      name: go
      classic: yes

  # DEBIAN - Docker (official repo)
  - name: Install docker (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    block:
      - name: Create apt keyrings directory
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Add Docker GPG key
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'

      - name: Get dpkg architecture
        command: dpkg --print-architecture
        register: dpkg_arch
        changed_when: false

      - name: Add Docker repository
        ansible.builtin.apt_repository:
          repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
          state: present
          filename: docker

      - name: Install Docker packages
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present

  # FEDORA - Docker (official repo)
  - name: Install docker (Fedora)
    when: ansible_facts['distribution'] == "Fedora"
    become: yes
    block:
      - name: Add Docker GPG key
        get_url:
          url: https://download.docker.com/linux/fedora/gpg
          dest: /etc/pki/rpm-gpg/docker-ce.asc
          mode: '0644'

      - name: Add Docker repository
        ansible.builtin.yum_repository:
          name: docker-ce-stable
          description: Docker CE Stable - $basearch
          baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
          gpgcheck: yes
          gpgkey: file:///etc/pki/rpm-gpg/docker-ce.asc
          enabled: yes

      - name: Install Docker packages
        dnf:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
          state: present

      - name: Enable and start Docker service
        ansible.builtin.systemd:
          name: docker
          enabled: yes
          state: started

  # DEBIAN - gitui (from GitHub releases; not in apt repos)
  - name: Install gitui (Debian)
    when: ansible_facts['os_family'] == "Debian"
    become: yes
    shell: |
      ARCH=$(uname -m)
      if [ "$ARCH" = "aarch64" ]; then
        TARBALL="gitui-linux-aarch64.tar.gz"
      else
        TARBALL="gitui-linux-musl.tar.gz"
      fi
      URL=$(curl -Ls https://api.github.com/repos/gitui-org/gitui/releases/latest | grep -o "https://[^\"]*${TARBALL}")
      wget -q "$URL" -O "$TARBALL"
      tar xzvf "$TARBALL"
      rm "$TARBALL"
      chmod +x gitui
      mv gitui /usr/local/bin
    args:
      creates: /usr/local/bin/gitui

  # ARCH LINUX - autologin setup (hyprlock runs on first Hyprland start)
  - name: Disable SDDM on Arch if present
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.systemd:
      name: sddm
      enabled: no
      state: stopped
    ignore_errors: yes

  - name: Create getty autologin override directory on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.file:
      path: /etc/systemd/system/getty@tty1.service.d
      state: directory
      mode: '0755'

  - name: Configure getty autologin on Arch
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.copy:
      dest: /etc/systemd/system/getty@tty1.service.d/override.conf
      content: |
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin shayne --noclear %I $TERM

  # BLUETOOTH (Arch only)
  - name: Enable and start bluetooth service (Arch Linux)
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    ansible.builtin.systemd:
      name: bluetooth
      enabled: yes
      state: started

  - name: Disable blueman connection/disconnection popup notifications
    when: ansible_facts['os_family'] == "Archlinux"
    become: false
    community.general.dconf:
      key: /org/blueman/general/plugin-list
      value: "['!ConnectionNotifier']"
      state: present

  # POSTMAN on Arch (AUR)
  - name: Install Postman (Arch AUR)
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq postman-bin 2>/dev/null || yay -S --noconfirm postman-bin
    changed_when: false

  # AWWW (AUR - Arch only; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install awww via yay (Arch Linux)
    when: ansible_facts['os_family'] == "Archlinux"
    become: true
    become_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    environment:
      HOME: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    shell: pacman -Qq awww 2>/dev/null || yay -S --noconfirm --sudoflags "-n" awww
    changed_when: false

  # HYPRIDLE (Arch official repos; Ubuntu handled in configure_ubuntu_desktop.yml)
  - name: Install hypridle (Arch Linux)
    when: ansible_facts['os_family'] == "Archlinux"
    become: yes
    pacman:
      name: hypridle
      state: present

  # DEBIAN DESKTOP - packages only relevant when a GUI is present
  - name: Install pavucontrol (Debian desktop)
    when: ansible_facts['os_family'] == "Debian" and ubuntu_type == "desktop"
    become: yes
    apt:
      name: pavucontrol
      state: present

  # CLAUDE CODE (all platforms)
  - name: Install Claude Code
    shell: curl -fsSL https://claude.ai/install.sh | bash
    args:
      creates: "/home/{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}/.claude/local/claude"
